services:
  php:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    env_file: .env
    environment:
      DB_HOST: mysql
      CMS_SESSION_PATH: /var/www/html/storage/sessions
    volumes:
      - sessions:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  database:
  sessions:
